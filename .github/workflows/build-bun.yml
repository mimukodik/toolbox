name: Build and prove Bun lint

on:
  pull_request:
    paths:
      - 'flake.*'
      - 'tools/bun/**'
      - 'install.sh'
      - '.github/workflows/build-bun.yml'
  push:
    branches: [main]
    paths:
      - 'flake.*'
      - 'tools/bun/**'
      - 'install.sh'
      - '.github/workflows/build-bun.yml'
  workflow_dispatch:
    inputs:
      build_control:
        description: Build the unpatched Bun control even if its inputs are unchanged
        type: boolean
        default: false
      darwin:
        description: Build and test the aarch64-darwin Bun only (skips the Linux jobs)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bun-lint-proof:
    if: ${{ !inputs.darwin }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 150
    env:
      BUN_PROOF_RUNNER: blacksmith-8vcpu-ubuntu-2404
      SLACK_LISTENER_REV: 8132eccf4db7799dc3647e467ddc08f7384aa9a8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to build the Bun control
        id: control
        shell: bash
        env:
          CONTROL_REQUESTED: ${{ inputs.build_control }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          build_control=true
          matched='not evaluated (control required)'
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            reason='running on main'
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$CONTROL_REQUESTED" == true ]]; then
            reason='requested by workflow_dispatch'
          else
            # PRs use the event's base commit. Manual branch runs compare to main.
            base=${PR_BASE:-origin/main}
            matched=$(git diff --no-renames --name-only "$base...HEAD" -- \
              flake.nix flake.lock tools/bun/package.nix tools/bun/prefetch.json \
              tools/bun/vendor.nix tools/bun/overlay.nix tools/bun/build-proof.sh \
              .github/workflows/build-bun.yml)
            if [[ -n "$matched" ]]; then
              reason='control input changed'
            else
              build_control=false
              reason='control skipped: no control input changed'
              matched='none'
            fi
          fi
          printf 'build_control=%s\n' "$build_control" >> "$GITHUB_OUTPUT"
          {
            printf '### Bun control decision\n\n'
            printf 'build_control=%s (%s)\n\n' "$build_control" "$reason"
            printf 'Matched control inputs:\n\n~~~text\n%s\n~~~\n' "$matched"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Ensure GNU time and zstd are available
        run: |
          if ! type -P time >/dev/null || ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends time zstd
          fi

      - name: Build unpatched Bun from source
        id: stock
        if: steps.control.outputs.build_control == 'true'
        run: bash tools/bun/build-proof.sh bun-unpatched

      - name: Build patched Bun from source
        id: patched
        run: bash tools/bun/build-proof.sh bun

      - name: Check diagnostics and time the lint passes
        if: steps.control.outputs.build_control == 'false' || steps.stock.outcome == 'success'
        env:
          BUN_BUILD_CONTROL: ${{ steps.control.outputs.build_control }}
        run: bash tools/bun/slack-lint-proof.sh

      - name: Run patched and listed Bun lint tests
        shell: bash
        run: |
          parked=$(awk '
            /^[[:space:]]*#[[:space:]]+cli\/lint\/[^/[:space:]]+\.test\.ts[[:space:]]*$/ {
              printf "PARKED: %s%s\n\n", $2, note
            }
            { note = "" }
            /^[[:space:]]*#[[:space:]]+Parked / {
              sub(/^[[:space:]]*#[[:space:]]+/, "")
              note = " (" $0 ")"
            }
          ' tools/bun/upstream-tests.txt)
          if [[ -n "$parked" ]]; then
            printf '### Parked upstream Bun lint tests\n\n%s\n\n' "$parked" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          bash tools/bun/test-upstream.sh

      - name: Package and measure the runtime closure
        run: bash tools/bun/package-release.sh

      - name: Install Bun and run slack-listener tests in Ubuntu without Nix
        shell: bash
        run: |
          out="$RUNNER_TEMP/bun-release"
          sha_file=("$out"/*.tar.zst.sha256)
          read -r sha256 asset < "${sha_file[0]}"
          version=$(jq -er .version "$out/manifest.json")
          bun_commit=$(jq -er .bun_commit "$out/manifest.json")
          smoke_log="$RUNNER_TEMP/bun-install.log"
          status=0

          docker run --rm \
            --mount "type=bind,source=$out,target=/release,readonly" \
            --mount "type=bind,source=$PWD/install.sh,target=/install.sh,readonly" \
            --mount "type=bind,source=/etc/ssl/certs/ca-certificates.crt,target=/runner-ca-certificates.crt,readonly" \
            ubuntu:24.04 sh -eu -c '
              if command -v nix; then exit 1; fi
              test ! -e /nix/store
              sed -i "s|http://|https://|g" /etc/apt/sources.list.d/ubuntu.sources
              printf "%s\n" "Acquire::https::CAInfo \"/runner-ca-certificates.crt\";" \
                > /etc/apt/apt.conf.d/99runner-ca
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends ca-certificates curl git jq zstd

              sh /install.sh "file:///release/$1" "$2"
              actual_version=$(bun --version)
              actual_revision=$(bun --revision)
              printf "bun --version: %s\nbun --revision: %s\n" "$actual_version" "$actual_revision"
              test "$actual_version" = "${3%%-*}"
              test "$actual_revision" = "$3+$4"
              bun lint --help

              mkdir /tmp/sharp-smoke
              cd /tmp/sharp-smoke
              printf "%s\n" "{\"name\":\"sharp-smoke\",\"private\":true}" > package.json
              bun add sharp@0.35.3
              bun -e "require(\"sharp\")({ create: { width: 2, height: 2, channels: 3, background: \"red\" } }).png().toBuffer().then((png) => console.log(\"sharp loads: png \" + png.length + \" bytes\"))"

              git init --quiet /tmp/slack-listener
              cd /tmp/slack-listener
              git fetch --no-tags --depth=1 https://github.com/mimukodik/slack-listener.git "$5"
              git checkout --quiet --detach FETCH_HEAD
              test "$(git rev-parse HEAD)" = "$5"
              bun install --frozen-lockfile
              bun test
            ' sh "$asset" "$sha256" "$version" "${bun_commit:0:9}" "$SLACK_LISTENER_REV" \
            2>&1 | tee "$smoke_log" || status=$?

          {
            printf '\n### Ubuntu install smoke test\n\n'
            sed -n '/^bun --version: /p; /^bun --revision: /p' "$smoke_log" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Save tested release files
        # A manual run of any branch keeps the tarball as an artifact. Only main publishes a release (see `release`).
        if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-release
          path: ${{ runner.temp }}/bun-release/
          if-no-files-found: error
          compression-level: 0

      - name: Upload unpatched Bun and its Nix closure
        if: ${{ !cancelled() && steps.stock.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-unpatched-x86_64-linux
          path: ${{ runner.temp }}/bun-closures/bun-unpatched/
          if-no-files-found: error
          compression-level: 0

      - name: Upload patched Bun and its Nix closure
        if: ${{ !cancelled() && steps.patched.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-patched-x86_64-linux
          path: ${{ runner.temp }}/bun-closures/bun/
          if-no-files-found: error
          compression-level: 0

      - name: Upload build and lint evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-lint-proof
          path: ${{ runner.temp }}/bun-proof/
          if-no-files-found: warn

  release:
    if: github.ref == 'refs/heads/main' && !inputs.darwin && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [bun-lint-proof, darwin-test]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: write
    concurrency:
      group: bun-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bun-release
          path: release

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bun-darwin-release
          path: release-darwin

      - name: Publish the immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Both builds passed their tests in this run. The release carries both or neither: a new release is
          # created as a draft with every file and published last. A published release that lacks the darwin
          # files (the Linux-only p3) gets them added, and the digests are checked again.
          tag=$(jq -er '"bun-" + .version + "-" + .bun_commit[:7] + "-" + .patchlevel' release/manifest.json)
          darwin_tag=$(jq -er '"bun-" + .version + "-" + .bun_commit[:7] + "-" + .patchlevel' release-darwin/manifest-aarch64-darwin.json)
          test "$tag" = "$darwin_tag"
          linux_asset="$tag-x86_64-linux.tar.zst"
          darwin_asset="$tag-aarch64-darwin.tar.zst"

          for pair in "release:$linux_asset:manifest.json" "release-darwin:$darwin_asset:manifest-aarch64-darwin.json"; do
            IFS=: read -r dir asset manifest <<< "$pair"
            (
              cd "$dir"
              read -r sha256 checksummed_asset < "$asset.sha256"
              test "$checksummed_asset" = "$asset"
              sha256sum --check "$asset.sha256"
              test "$(jq -er .sha256 "$manifest")" = "$sha256"
              test "$(jq -er .source_commit "$manifest")" = "$GITHUB_SHA"
            )
          done
          linux_sha=$(cut -d' ' -f1 "release/$linux_asset.sha256")
          darwin_sha=$(cut -d' ' -f1 "release-darwin/$darwin_asset.sha256")
          cp "release-darwin/$darwin_asset" "release-darwin/$darwin_asset.sha256" release-darwin/manifest-aarch64-darwin.json release/
          cd release

          digest_of() { # releases-json asset
            jq -r --arg asset "$2" 'select(.draft == false) | .assets[] | select(.name == $asset) | .digest // ""' <<< "$1"
          }

          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$tag\")")
          if [[ -n "$releases" ]]; then
            if [[ $(jq -s 'map(select(.draft == false)) | length' <<< "$releases") == 0 ]]; then
              echo "::error::Release $tag exists only as a draft. Delete the draft or bump PATCHLEVEL."
              exit 1
            fi
            if [[ "$(digest_of "$releases" "$linux_asset")" != "sha256:$linux_sha" ]]; then
              echo "::error::Release $tag exists without the matching Linux asset. Bump PATCHLEVEL."
              exit 1
            fi
            current=$(digest_of "$releases" "$darwin_asset")
            if [[ "$current" == "sha256:$darwin_sha" ]]; then
              printf 'Release %s already has both assets. Skipping.\n' "$tag"
              exit 0
            fi
            if [[ -n "$current" ]]; then
              echo "::error::Release $tag has a different $darwin_asset. Bump PATCHLEVEL."
              exit 1
            fi
            gh release upload "$tag" "$darwin_asset" "$darwin_asset.sha256" manifest-aarch64-darwin.json
            releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$tag\")")
            test "$(digest_of "$releases" "$darwin_asset")" = "sha256:$darwin_sha"
            test "$(digest_of "$releases" "$linux_asset")" = "sha256:$linux_sha"
            printf 'Added the darwin files to release %s.\n' "$tag"
            exit 0
          fi

          tags=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")
          if [[ -n "$tags" ]]; then
            echo "::error::Tag $tag already exists without a release. Bump PATCHLEVEL."
            exit 1
          fi

          gh release create "$tag" "$linux_asset" "$linux_asset.sha256" manifest.json \
            "$darwin_asset" "$darwin_asset.sha256" manifest-aarch64-darwin.json \
            --draft --target "$GITHUB_SHA" --title "$tag" \
            --notes "Bun for Linux x86_64 (runtime closure) and macOS aarch64 (single binary). [Build and measurements](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          drafted=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$tag\" and .draft == true)")
          for pair in "$linux_asset:$linux_sha" "$darwin_asset:$darwin_sha"; do
            asset=${pair%%:*}; sha=${pair##*:}
            test "$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest // ""' <<< "$drafted")" = "sha256:$sha"
          done
          gh release edit "$tag" --draft=false

  darwin-build:
    if: inputs.darwin || github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Cross-compile Bun for aarch64-darwin
        run: bash tools/bun/build-darwin.sh

      - name: Package the release files
        run: bash tools/bun/package-darwin.sh

      - name: Save the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-darwin-release
          path: ${{ runner.temp }}/bun-darwin-package/
          if-no-files-found: error
          compression-level: 0

  darwin-test:
    if: inputs.darwin || github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: darwin-build
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SLACK_LISTENER_REV: 8132eccf4db7799dc3647e467ddc08f7384aa9a8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bun-darwin-release
          path: release

      - name: Install zstd
        run: command -v zstd || brew install zstd

      - name: Test the downloaded binary
        run: bash tools/bun/test-darwin.sh "$PWD/release"

  darwin-mise-proof:
    if: needs.release.result == 'success'
    needs: release
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Install the published release with mise, from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise_version=2026.9.17
          curl --fail --silent --show-error --location --retry 3 -o mise.tar.gz \
            "https://github.com/jdx/mise/releases/download/v$mise_version/mise-v$mise_version-macos-arm64.tar.gz"
          echo "63deaba3321800014feb6a92f1fed38680edf8deccbe972beebcdae7b67f3172  mise.tar.gz" | shasum -a 256 -c
          tar -xzf mise.tar.gz
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,targetCommitish \
            --jq "map(select(.tagName | startswith(\"bun-\")) | select(.targetCommitish == \"$GITHUB_SHA\")) | .[0].tagName")
          test -n "$tag"
          mkdir proof && cd proof
          cat > mise.toml <<TOML
          [tools]
          "github:$GITHUB_REPOSITORY" = { version = "${tag#bun-}", version_prefix = "bun-", platforms.macos-arm64.asset_pattern = "*-aarch64-darwin.tar.zst" }
          TOML
          export MISE_TRUSTED_CONFIG_PATHS="$PWD" MISE_YES=1 MISE_USE_VERSIONS_HOST=0
          ../mise/bin/mise install
          revision=$(../mise/bin/mise exec -- bun --revision)
          printf 'mise installed %s from the release: bun --revision %s\n' "$tag" "$revision" | tee -a "$GITHUB_STEP_SUMMARY"
