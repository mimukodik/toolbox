name: Effect lint parity

on:
  pull_request:
    paths:
      - 'tools/effect-parity/**'
      - '.github/workflows/effect-parity.yml'
  push:
    branches: [main]
    paths:
      - 'tools/effect-parity/**'
      - '.github/workflows/effect-parity.yml'
  workflow_dispatch:
    inputs:
      bun_build_run:
        description: Successful Bun build run ID for this commit or an ancestor with the same build inputs. Leave blank to score the pinned release.
        type: string
        required: false
      regenerate_rule_docs:
        description: Regenerate Bun rule docs with the candidate and verify the checked-in output.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  parity:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      BUN_BUILD_RUN: ${{ inputs.bun_build_run }}
      EFFECT_REV: 0e722d359c969bdf1b1316f08e8637022cde3cce
      BUN_RELEASE: bun-1.4.6-canary.1-b15f513-p3
      BUN_RELEASE_SHA256: c5f5d133f764f912ebdad9776f807f64cc415e33b6b57ad8fa41504bebe54b7d
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check out Effect fixtures and reference baselines
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Effect-TS/tsgo
          ref: ${{ env.EFFECT_REV }}
          path: .effect-tsgo
          persist-credentials: false
          sparse-checkout: |
            testdata/tests/effect-v4
            testdata/baselines/reference/effect-v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
          package_json_file: tools/effect-parity/fixtures/package.json

      - name: Install locked dependencies
        shell: bash
        run: |
          printf 'STOCK_BUN=%s\n' "$(command -v bun)" >> "$GITHUB_ENV"
          test "$(git -C .effect-tsgo rev-parse HEAD)" = "$EFFECT_REV"
          diff -u --strip-trailing-cr .effect-tsgo/testdata/tests/effect-v4/package.json \
            tools/effect-parity/fixtures/package.json
          pnpm --dir tools/effect-parity/fixtures install --frozen-lockfile --ignore-scripts
          (cd tools/effect-parity/linter && bun install --frozen-lockfile --ignore-scripts)

      - name: Install the patched Bun release
        if: env.BUN_BUILD_RUN == ''
        shell: bash
        run: |
          url="https://github.com/mimukodik/toolbox/releases/download/$BUN_RELEASE/$BUN_RELEASE-x86_64-linux.tar.zst"
          curl -fsSL "https://raw.githubusercontent.com/mimukodik/toolbox/$BUN_RELEASE/install.sh" \
            -o "$RUNNER_TEMP/toolbox-install.sh"
          sudo sh "$RUNNER_TEMP/toolbox-install.sh" "$url" "$BUN_RELEASE_SHA256"
          /usr/local/bin/bun --revision

      - name: Verify the candidate build run
        if: env.BUN_BUILD_RUN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$BUN_BUILD_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::bun_build_run must be a numeric GitHub Actions run ID.'
            exit 1
          fi
          head=$(git rev-parse HEAD)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUN_BUILD_RUN")
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" '
            .head_repository.full_name == $repo and (.head_sha | test("^[a-f0-9]{40}$")) and
            .path == ".github/workflows/build-bun.yml" and .conclusion == "success"
          ' <<< "$run" > /dev/null; then
            echo "::error::Run $BUN_BUILD_RUN must be a successful build-bun.yml run from $GITHUB_REPOSITORY."
            exit 1
          fi
          build_sha=$(jq -r .head_sha <<< "$run")
          if [[ "$build_sha" != "$head" ]]; then
            # The compare API returns at most 300 changed files, all on page one.
            compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$build_sha...$head?per_page=1")
            if ! jq -e --arg build "$build_sha" '
              def parity_only:
                startswith("tools/effect-parity/") or
                . == ".github/workflows/effect-parity.yml" or
                . == "tools/bun/effect-port-differences.md";
              .merge_base_commit.sha == $build and
              (.files | type == "array" and length < 300 and
                all(.[]; (.filename | parity_only) and ((.previous_filename // .filename) | parity_only)))
            ' <<< "$compare" > /dev/null; then
              echo "::error::Bun build $build_sha must be an ancestor of $head with only parity files changed."
              exit 1
            fi
          fi
          printf 'EFFECT_PARITY_BUILD_SHA=%s\n' "$build_sha" >> "$GITHUB_ENV"

      - name: Set up Nix for the candidate runtime
        if: env.BUN_BUILD_RUN != ''
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Download the candidate Bun closure
        if: env.BUN_BUILD_RUN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bun-patched-x86_64-linux
          path: ${{ runner.temp }}/effect-bun-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.bun_build_run }}
          github-token: ${{ github.token }}

      - name: Import the candidate runtime closure
        if: env.BUN_BUILD_RUN != ''
        shell: bash
        working-directory: ${{ runner.temp }}/effect-bun-candidate
        run: |
          read -r sha256 asset < closure.nix-export.zst.sha256
          test "$asset" = closure.nix-export.zst
          printf '%s  closure.nix-export.zst\n' "$sha256" | sha256sum --check --strict
          read -r store_path < store-path.txt
          if [[ ! "$store_path" =~ ^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$ ]]; then
            echo '::error::Candidate closure does not name a valid Nix store path.'
            exit 1
          fi
          zstd -dc closure.nix-export.zst | sudo "$(command -v nix-store)" --import
          candidate="$store_path/bin/bun"
          revision=$("$candidate" --revision)
          printf 'EFFECT_PARITY_CANDIDATE_BUN=%s\n' "$candidate" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/effect-parity"
          {
            printf 'Build run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BUN_BUILD_RUN"
            printf 'Bun build commit: %s\nParity commit: %s\n' "$EFFECT_PARITY_BUILD_SHA" "$GITHUB_SHA"
            printf 'Closure SHA-256: %s\nBun revision: %s\n' "$sha256" "$revision"
          } | tee "$RUNNER_TEMP/effect-parity/effect-bun-candidate.txt"

      - name: Score both reference paths, then patched Bun
        id: score
        run: |
          mkdir -p "$RUNNER_TEMP/effect-parity"
          "$STOCK_BUN" tools/effect-parity/parity.ts .effect-tsgo "$RUNNER_TEMP/effect-parity"

      - name: Report generated Effect lint differences
        if: ${{ !cancelled() && env.BUN_BUILD_RUN != '' && steps.score.outputs.candidate_scored == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          # Leave an artifact even if the process hits the wall-time limit.
          summary="$RUNNER_TEMP/effect-parity/differential-summary.md"
          printf '# Effect lint differential\n\nReport incomplete. See the workflow step log.\n' > "$summary"
          timeout --kill-after=5s 285s "$STOCK_BUN" tools/effect-parity/differential.ts \
            .effect-tsgo "$RUNNER_TEMP/effect-parity"

      - name: Regenerate candidate Bun rule docs
        if: ${{ !cancelled() && env.EFFECT_PARITY_CANDIDATE_BUN != '' && inputs.regenerate_rule_docs }}
        shell: bash
        run: |
          source=$(nix build --no-link --print-out-paths .#bun.src)
          scratch=$(mktemp -d "$RUNNER_TEMP/bun-rule-docs.XXXXXX")
          tar -xzf "$source" -C "$scratch" --strip-components=1 --wildcards \
            '*/src/codegen/lint-rule-docs.ts' '*/src/codegen/lint-rule-options.ts' '*/docs/lint/rules/*'
          for patch in "$GITHUB_WORKSPACE"/tools/bun/patches/*.patch; do
            [[ -f "$patch" && ! -L "$patch" ]] || continue
            git -C "$scratch" apply --include='docs/lint/rules/**' "$patch"
          done
          cd "$scratch"
          cp -a docs/lint/rules checked-in
          "$EFFECT_PARITY_CANDIDATE_BUN" src/codegen/lint-rule-docs.ts --write
          diff -ru checked-in docs/lint/rules | tee "$RUNNER_TEMP/effect-parity/bun-rule-docs.diff"

      - name: Upload parity evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: effect-parity
          path: ${{ runner.temp }}/effect-parity
          if-no-files-found: warn
